apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-frontend
  namespace: inventory-tracker
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: inventory-frontend
  template:
    metadata:
      labels:
        app: inventory-frontend
    spec:
      nodeSelector:
        agentpool: nodepool3
      containers:
      - name: inventory-frontend
        image: acrinventorymunish123.azurecr.io/inventory-frontend:${IMAGE_TAG}
        imagePullPolicy: Always
        ports:
        - containerPort: 80
        env:
        - name: BACKEND_API_URL
          value: "http://backend-service:8080"
        resources:
          requests:
            cpu: "200m"
            memory: "256Mi"
          limits:
            cpu: "400m"
            memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: inventory-tracker
spec:
  type: ClusterIP
  selector:
    app: inventory-frontend
  ports:
  - port: 80
    targetPort: 80